name: Course Quality CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality-gate:
    name: 🛡️ Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Python Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff numpy scipy matplotlib

    # ------------------------------------------------------------------
    # 1. Code Intelligence (Linter)
    # ------------------------------------------------------------------
    - name: 🐍 Lint Python (Ruff)
      run: |
        # E=Error, F=Pyflakes, W=Warning. 
        # We start gentle.
        ruff check . --select=E,F,W --ignore=E501

    # ------------------------------------------------------------------
    # 2. Project Logic (Custom Validators)
    # ------------------------------------------------------------------
    - name: 🔗 Validate Links & Assets
      run: python .agent/skills/validate_links.py

    - name: ⏱️ Check Course Duration
      run: python .agent/skills/validate_script_length.py

    # ------------------------------------------------------------------
    # 3. Text Intelligence (Spell Check)
    # ------------------------------------------------------------------
    - name: 📝 Check Spelling (Typos)
      uses: crate-ci/typos@master
      with:
        # Ignore specific file types or folders if needed
        files: .
        # Default config usually works well, can be tuned with typos.toml
