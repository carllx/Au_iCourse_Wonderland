name: Course Quality CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # If skills have specific deps, add them here. 
        # Currently standard lib or lightweight.
        # numpy/scipy needed for some asset generation but not for VALIDATION scripts usually,
        # unless validation imports them. 
        # Check: validate_links (os, re) - Safe.
        # Check: validate_script_length (os, re) - Safe.

    - name: 1. Validate Links & Assets
      run: python .agent/skills/validate_links.py

    - name: 2. Check Course Duration
      run: python .agent/skills/validate_script_length.py
