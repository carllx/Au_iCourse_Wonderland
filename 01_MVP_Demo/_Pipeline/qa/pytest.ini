[pytest]
# Pytest 配置文件

# 测试目录
testpaths = tests

# 测试文件模式
python_files = test_*.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers

# 标记定义
markers =
    unit: 单元测试
    property: 属性测试
    integration: 集成测试
    slow: 慢速测试

# Hypothesis 配置
hypothesis_profile = default

[hypothesis]
# 默认配置
max_examples = 100
deadline = None
